[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "physim"
version = "0.1.0"
description = "Mini Simscape-style 1D physical network simulator (electrical / rotational / thermal) with an implicit trapezoidal DAE solver"
readme = "README.md"
requires-python = ">=3.9"
dependencies = ["numpy", "scipy", "matplotlib"]

[project.optional-dependencies]
test = ["pytest"]

[tool.setuptools]
packages = ["physim"]
